project:
  type: website
  output-dir: _site
  resources:
    - "images/*"
    - "images/web/*"
    - "images/project-images/*"
    - "images/project-images/**/*"
  render:
    - "*.qmd"
    - "**/*.qmd"
    - "!IMAGE-AUDIT-REPORT.md"
    - "!QUICK-IMAGE-REFERENCE.md"
    - "!YET-COMPASSION-DESIGN-SYSTEM.md"

website:
  title: "Y.E.T. Compassion"
  description: "Y.E.T. Compassion is building a Christian school in Juba, South Sudan, and grounding young people in biblical truth — advancing hope, healing, and transformation through Christian education and youth evangelism."
  favicon: images/logo.png
  site-url: https://www.yetcompassion.org
  repo-url: https://github.com/yetcompassion/website

  open-graph:
    locale: en_US
    site-name: "Y.E.T. Compassion"
    image: /images/logo.png
    description: "Building a Christian school in Juba, South Sudan — because education, grounded in Christ, changes lives."

  twitter-card:
    card-style: summary_large_image
    site: "@yetcompassion"

  navbar:
    background: "#FFFFFF"
    foreground: "#2B2B2B"
    logo: images/logo.png
    logo-alt: "Y.E.T. Compassion"
    pinned: true
    title: false
    collapse-below: md
    right:
      - text: "Our Story"
        menu:
          - text: "Mission & Vision"
            href: about/index.qmd
          - text: "Our Founder"
            href: about/founder.qmd
          - text: "Board of Directors"
            href: about/board.qmd
      - text: "The School"
        href: school.qmd
      - text: "Youth Evangelism"
        href: youth-evangelism.qmd
      - text: "Watch Live"
        href: watch-live.qmd
      - text: "Get Involved"
        menu:
          - text: "Volunteer & Partner"
            href: get-involved.qmd
          - text: "The School Campaign"
            href: campaigns/2026.qmd
          - text: "Events"
            href: events/index.qmd
      - text: "Blog"
        href: blog/index.qmd
      - text: "Contact"
        href: contact.qmd
      - text: "Donate"
        href: donate.qmd
    search: true

  page-footer:
    background: "#060F1F"
    foreground: "#F7F6F2"
    center: |
      <div class="yet-footer"><div class="yet-footer-verse"><span class="verse-text">"Go therefore and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit, teaching them to observe all that I have commanded you. And behold, I am with you always, to the end of the age."</span><span class="verse-ref">Matthew 28:19–20 · ESV</span></div><div class="yet-footer-grid"><div class="yet-footer-brand"><p class="brand-name">Y.E.T. Compassion</p><p class="brand-sub">Youth Evangelism Training</p><p class="brand-mission">Building a Christian school in Juba, South Sudan, and grounding young people in biblical truth — advancing hope, healing, and transformation through Christian education.</p><div class="brand-social"><a href="https://www.facebook.com/YetCompassion" target="_blank" rel="noopener noreferrer" aria-label="Y.E.T. Compassion on Facebook"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg></a><a href="https://www.linkedin.com/in/gai-luom-155b83b3/" target="_blank" rel="noopener noreferrer" aria-label="Founder on LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a></div></div><div class="yet-footer-col"><h4>Our Story</h4><ul><li><a href="/about/index.html">Mission &amp; Vision</a></li><li><a href="/about/founder.html">Our Founder</a></li><li><a href="/about/board.html">Board of Directors</a></li><li><a href="/blog/index.html">Blog</a></li><li><a href="/transparency.html">Financial Transparency</a></li></ul></div><div class="yet-footer-col"><h4>What We Do</h4><ul><li><a href="/school.html">The School</a></li><li><a href="/youth-evangelism.html">Youth Evangelism</a></li><li><a href="/watch-live.html">Watch Live</a></li><li><a href="/campaigns/2026.html">The School Campaign</a></li></ul></div><div class="yet-footer-col"><h4>Get Involved</h4><ul><li><a href="/donate.html">Donate</a></li><li><a href="/get-involved.html">Volunteer &amp; Partner</a></li><li><a href="/events/index.html">Events</a></li><li><a href="/contact.html">Contact Us</a></li><li><a href="/faq.html">FAQ</a></li></ul></div></div><div class="yet-footer-legal"><div class="legal-inner"><span>© 2006–2026 Youth Evangelism Training (Y.E.T.) Compassion · A 501(c)(3) nonprofit · Nashville, TN</span><span><a href="/privacy.html">Privacy Policy</a> &nbsp;·&nbsp; <a href="/transparency.html">Financial Transparency</a></span></div></div></div>

  page-navigation: true
  bread-crumbs: true
  back-to-top-navigation: true

format:
  html:
    theme:
      light: [cosmo, styles/custom.scss]
    css: styles/custom.css
    fontsize: 18px
    linestretch: 1.6
    mainfont: "'Inter', 'Source Sans 3', -apple-system, BlinkMacSystemFont, sans-serif"
    monofont: "'JetBrains Mono', 'Fira Code', monospace"
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&display=swap" rel="stylesheet">
          <meta name="robots" content="index, follow">
          <meta name="author" content="Y.E.T. Compassion">
          <meta name="geo.region" content="US-TN">
          <meta name="geo.placename" content="Nashville">
    include-after-body:
      - file: _includes/footer-scripts.html
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    toc: false
