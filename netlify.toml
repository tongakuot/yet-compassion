# ═══════════════════════════════════════════════════
# Y.E.T. Compassion — Netlify Configuration
# ═══════════════════════════════════════════════════

[[plugins]]
  package = "@quarto/netlify-plugin-quarto"
  [plugins.inputs]
    # Pinned to the version the site is QA'd against. Quarto 1.10.x
    # mangles single-quoted font names inside inline style attributes
    # (breaks button/gold styling site-wide). Bump deliberately, then
    # verify inline styles survive before keeping the new version.
    version = "1.6.42"
    cmd = "render"

[build]
  publish = "_site"
  # remove or empty the command so the plugin runs the render step
  command = ""

# ── Functions ──────────────────────────────────────
# Serverless functions live in netlify/functions and are bundled with esbuild
# so we ship lean cold-start payloads (campaign-progress is a single file
# using only fetch + Stripe REST — no SDK needed).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Headers ────────────────────────────────────────
# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Redirects ──────────────────────────────────────
# Trailing slash normalization
[[redirects]]
  from = "/donate"
  to = "/donate.html"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301

# Friendly campaign URLs
[[redirects]]
  from = "/campaign"
  to = "/campaigns/2026.html"
  status = 301

[[redirects]]
  from = "/campaigns"
  to = "/campaigns/2026.html"
  status = 301

[[redirects]]
  from = "/campaigns/2026"
  to = "/campaigns/2026.html"
  status = 301

# Cache the live progress endpoint at the edge for 10 min so we don't hammer
# Stripe (the function itself also sets this, but pinning it here makes the
# behavior obvious to future maintainers).
[[headers]]
  for = "/.netlify/functions/campaign-progress"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=600, stale-while-revalidate=86400"

# Custom 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
